# Absorbs the internet's background scanning at the Caddy log, before it reaches
# Node at all. This and the in-app login throttle divide cleanly: the throttle
# handles someone attacking the two known accounts, and this handles the noise
# floor that is not aimed at anything in particular.

[caddy-language-learner]
enabled  = true
filter   = caddy-language-learner
logpath  = /var/log/caddy/language-learner.access.log
backend  = auto
port     = http,https

# Ten probes in ten minutes is far past anything a person does by accident, and
# far below what a scanner does in a second.
maxretry = 10
findtime = 600
bantime  = 3600

ignoreip = 127.0.0.1/8 ::1 192.168.0.0/16 10.0.0.0/8

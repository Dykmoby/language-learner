# Reads Caddy's JSON access log for language-learner.duckdns.org.
#
# Two signatures, because the application's own shape decides what scanning looks
# like here. The choke point redirects every unknown path to the login screen, so
# a scanner probing /wp-admin gets a 307 rather than a 404 — matching only on 4xx
# would miss almost all of it.
#
#   1. any 4xx response
#   2. a redirect for a URI outside the application's real surface
#
# A signed-out person loading the site gets one redirect, for "/", which the
# second pattern deliberately excludes — as it does the login screen itself, the
# API routes and static assets.
#
# The patterns deliberately do not anchor on the timestamp: fail2ban removes the
# substring matched by datepattern from the line before applying failregex.

[Definition]

_access = "logger":"http\.log\.access[^"]*".*"remote_ip":"<HOST>"

failregex = %(_access)s.*"status":4\d\d[,}]
            %(_access)s.*"uri":"(?!/(?:login|api/|admin/health|_next/|favicon\.ico)|/")[^"]*".*"status":30\d[,}]

ignoreregex =

datepattern = "ts":{EPOCH}

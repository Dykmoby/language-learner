# Reads Caddy's JSON access log for language-learner.duckdns.org.
#
# One signature: a request for a URI outside the application's real surface that
# came back 4xx or 3xx. Both halves are needed.
#
# The URI half is what keeps real people out of the jail. The application answers
# a non-Admin Student asking for /admin/health with 404, and redirects a
# signed-out visitor from "/" with 307 — banning on status alone would count the
# application's own correct behaviour toward banning the two people it is for.
#
# The status half is what keeps the jail useful. The choke point redirects every
# unknown path to the login screen, so a scanner probing /wp-admin gets a 307
# rather than a 404, and matching only on 4xx would miss almost all of it.
#
# The patterns deliberately do not anchor on the timestamp: fail2ban removes the
# substring matched by datepattern from the line before applying failregex.

[Definition]

_access     = "logger":"http\.log\.access[^"]*".*"remote_ip":"<HOST>"
_off_surface = "uri":"(?!/(?:login|api/|admin/health|_next/|favicon\.ico)|/")[^"]*"

failregex = %(_access)s.*%(_off_surface)s.*"status":(?:4\d\d|30\d)[,}]

ignoreregex =

datepattern = "ts":{EPOCH}

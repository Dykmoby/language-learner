<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; background: #f7f8fa; color: #16181d; -webkit-font-smoothing: antialiased; }
    a { color: #3559c7; text-decoration: none; }
    a:hover { color: #28459d; }
  </style>
</helmet>


<div style="display: flex; min-height: 700px; background: #f7f8fa">
  <aside style="width: 264px; flex: none; background: #ffffff; border-right: 1px solid #e6e8ee; display: flex; flex-direction: column; gap: 24px; padding: 20px 14px">
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 10px">
      <div style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em">Language Learner</div>
      <div style="font-size: 13px; color: #5b6371">Все курсы</div>
    </div>

    <nav style="display: flex; flex-direction: column; gap: 2px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 14px; background: #eef2fd; color: #2c47a0; font-weight: 500">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H19v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M8 4v16"/></svg>

        Администрирование

    <div style="margin-top: auto; border-top: 1px solid #eef0f4; padding-top: 14px; display: flex; align-items: center; gap: 10px; padding-left: 10px; padding-right: 10px">
      <span style="width: 28px; height: 28px; flex: none; border-radius: 999px; background: #eef2fd; color: #3559c7; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">D</span>
      <span style="font-size: 13.5px; flex-grow: 1">dykmoby</span>
      <a href="#" style="display: flex; color: #8b93a3" title="Выйти">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h9"/></svg>
      </a>
    </div>
  </aside>

  <main style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 40px 56px">
    <div style="width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 26px">

      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Мои курсы</h1>
        <p style="margin: 0; font-size: 14px; color: #5b6371">dykmoby · роль Admin</p>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">

        <a href="#" style="background: #ffffff; border: 1px solid #e6e8ee; border-radius: 14px; box-shadow: 0 1px 2px rgba(16,24,40,0.04); padding: 22px; display: flex; flex-direction: column; gap: 16px; color: #16181d">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Английский с нуля</span>
              <span style="font-size: 13px; color: #5b6371">Английский · A2</span>

          <div style="display: flex; flex-direction: column; gap: 8px">

            </div>

          </div>
        </a>

        <a href="#" style="background: #ffffff; border: 1px solid #e6e8ee; border-radius: 14px; box-shadow: 0 1px 2px rgba(16,24,40,0.04); padding: 22px; display: flex; flex-direction: column; gap: 16px; color: #16181d">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Тоҷикӣ. Аввалин қадам</span>
              <span style="font-size: 13px; color: #5b6371">Таджикский · A1</span>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; gap: 3px; height: 6px">
              <span style="flex-grow: 1; border-radius: 999px; background: #10693c"></span><span style="flex-grow: 1; border-radius: 999px; background: #e6e8ee"></span><span style="flex-grow: 1; border-radius: 999px; background: #e6e8ee"></span><span style="flex-grow: 1; border-radius: 999px; background: #e6e8ee"></span>
            </div>
            <span style="font-size: 13px; color: #5b6371">4 урока · пройдено 18%</span>
          </div>
        </a>

      </div>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
